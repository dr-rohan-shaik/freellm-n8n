version: '3.8'

services:
  freellm-n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freellm-n8n
    ports:
      - "5678:5678"
    environment:
      # n8n configuration
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678
      
      # Database (using SQLite by default)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      
      # FreeLLM configuration (optional - can also be set in n8n UI)
      - FREELLM_API_URL=https://api.freellm.com/v1
      - FREELLM_DEFAULT_MODEL=freellm-gpt-4o
      
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your-encryption-key-change-in-production}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-your-jwt-secret-change-in-production}
      
      # Optional: Enable metrics
      - N8N_DIAGNOSTICS_ENABLED=false
      
      # Optional: Custom nodes path
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      
    volumes:
      - n8n_data:/home/node/.n8n
      - ./packages/nodes-freellm:/home/node/.n8n/custom/nodes-freellm:ro
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL for production
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: freellm-n8n-postgres
  #   environment:
  #     - POSTGRES_DB=n8n
  #     - POSTGRES_USER=n8n
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U n8n"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Optional: Qdrant for vector storage (RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: freellm-n8n-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
  qdrant_data:
  # postgres_data: