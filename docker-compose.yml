version: '3.8'

services:
  # FreeLLMAPI - Self-hosted LLM Gateway (tashfeenahmed/freellmapi)
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    ports:
      - "3000:3000"
    environment:
      # Database
      - DATABASE_URL=file:/data/db.sqlite
      # Security - CHANGE IN PRODUCTION!
      - ENCRYPTION_KEY=${FREELLM_ENCRYPTION_KEY:-your-32-char-encryption-key}
      - JWT_SECRET=${FREELLM_JWT_SECRET:-your-32-char-jwt-secret}
      # Dashboard
      - DASHBOARD_ORIGINS=http://localhost:5173,http://localhost:3000
      # CORS for n8n
      - ALLOWED_HOSTS=*
      # Optional: Trust proxy if behind reverse proxy
      # - TRUST_PROXY=true
      # Optional: Rate limiting
      - PROXY_RATE_LIMIT_RPM=100
      # Optional: Request body limit for vision
      - REQUEST_BODY_LIMIT_MB=25
    volumes:
      - freellmapi_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # n8n with FreeLLM nodes
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freellm-n8n
    ports:
      - "5678:5678"
    environment:
      # n8n configuration
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678
      
      # Database (using SQLite by default)
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      
      # FreeLLM configuration (pre-fill for convenience)
      - FREELLM_API_URL=http://freellmapi:3000/v1
      - FREELLM_DEFAULT_MODEL=gpt-4o
      
      # Security - CHANGE IN PRODUCTION!
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-your-encryption-key-change-in-production}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-your-jwt-secret-change-in-production}
      
      # Optional: Enable metrics
      - N8N_DIAGNOSTICS_ENABLED=false
      
      # Custom nodes path
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      
    volumes:
      - n8n_data:/home/node/.n8n
      - ./packages/nodes-freellm:/home/node/.n8n/custom/nodes-freellm:ro
      
    depends_on:
      freellmapi:
        condition: service_healthy
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Qdrant for vector storage (RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: freellm-n8n-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
  qdrant_data:
  freellmapi_data: